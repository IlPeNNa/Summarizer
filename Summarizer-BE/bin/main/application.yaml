spring:
  application:
    name: myapp
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  
  # Database configuration (currently disabled)
  # Uncomment and configure when database is needed
  # datasource:
  #   url: jdbc:mysql://localhost:3306/summarizer
  #   username: your_username
  #   password: ${DB_PASSWORD:your_password}  # Use environment variable
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true
  #   properties:
  #     hibernate:
  #       dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

server:
  port: 8080

# Configurazione servizio NLP Python (black box)
nlp:
  service:
    url: http://localhost:8000