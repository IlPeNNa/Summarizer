<div class="output-panel">
  <h2>📤 Riassunto generato</h2>
  
  <!-- Empty State -->
  <div *ngIf="!hasSummary && !isLoading" class="empty-state">
    <div class="empty-icon">📋</div>
    <p>Il riassunto apparirà qui</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p>Generazione del riassunto in corso...</p>
  </div>

  <!-- Summary Result -->
  <div *ngIf="hasSummary" class="summary-result">
    <div class="summary-text">
      {{ summary }}
    </div>

    <!-- Statistiche -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Testo originale:</span>
        <span class="stat-value">{{ originalLength }} caratteri</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Riassunto:</span>
        <span class="stat-value">{{ summaryLength }} caratteri</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Riduzione:</span>
        <span class="stat-value">{{ reductionPercentage.toFixed(1) }}%</span>
      </div>
    </div>

    <!-- Download Section -->
    <div class="download-section">
      <h3>⬇️ Scarica il riassunto</h3>
      <div class="download-buttons">
        <button (click)="onDownloadTxt()" class="btn-download">
          <span class="download-icon">📄</span>
          TXT
        </button>
        <button (click)="onDownloadDocx()" class="btn-download">
          <span class="download-icon">📘</span>
          DOCX
        </button>
        <button (click)="onDownloadPdf()" class="btn-download">
          <span class="download-icon">📕</span>
          PDF
        </button>
      </div>
    </div>
  </div>
</div>
