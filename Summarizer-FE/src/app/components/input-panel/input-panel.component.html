<div class="input-panel">
  <h2>📥 Input del testo</h2>
  
  <!-- Messaggi -->
  <div *ngIf="successMessage" class="alert alert-success">
    ✓ {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-error">
    ✗ {{ errorMessage }}
  </div>
  
  <!-- Tab: Scrivi o Carica File -->
  <div class="input-tabs">
    <label class="tab-option">
      <input type="radio" name="inputMode" value="text" checked> 
      ✍️ Scrivi/Incolla testo
    </label>
    <label class="tab-option">
      <input type="radio" name="inputMode" value="file"> 
      📎 Carica file
    </label>
  </div>

  <!-- Area di testo -->
  <div class="text-input-area">
    <textarea 
      [(ngModel)]="inputText" 
      placeholder="Incolla o scrivi qui il testo da riassumere..."
      rows="12"
      class="text-input"
    ></textarea>
  </div>

  <!-- File Upload con Drag & Drop -->
  <div 
    class="file-upload-area"
    [class.dragging]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <div *ngIf="!fileName" class="upload-placeholder">
      <div class="upload-icon">⬆️</div>
      <p><strong>Trascina qui il tuo file</strong></p>
      <p class="upload-or">oppure</p>
      <label class="upload-button">
        <input 
          type="file" 
          (change)="onFileSelected($event)" 
          accept=".txt,.json"
          style="display: none;"
        />
        Scegli file
      </label>
      <p class="file-info">Formati supportati: TXT, JSON</p>
    </div>
    
    <div *ngIf="fileName" class="file-selected">
      <span class="file-icon">📄</span>
      <span class="file-name">{{ fileName }}</span>
      <button class="btn-clear" (click)="clearFile()">✕</button>
    </div>
  </div>

  <!-- Parametri del riassunto -->
  <div class="parameters-section">
    <h3>⚙️ Parametri del riassunto</h3>
    
    <div class="param-group">
      <label>Lunghezza del riassunto:</label>
      <select [(ngModel)]="summaryLength" (change)="onLengthPresetChange()" class="select-input">
        <option value="short">Breve (30-80 caratteri)</option>
        <option value="medium">Medio (50-150 caratteri)</option>
        <option value="long">Lungo (100-250 caratteri)</option>
        <option value="custom">Personalizzato</option>
      </select>
    </div>

    <div *ngIf="summaryLength === 'custom'" class="custom-params">
      <div class="param-group">
        <label>Lunghezza minima: <strong>{{ minLength }}</strong></label>
        <input 
          type="range" 
          [(ngModel)]="minLength" 
          min="10" 
          max="300" 
          step="10"
          class="slider"
        />
      </div>
      
      <div class="param-group">
        <label>Lunghezza massima: <strong>{{ maxLength }}</strong></label>
        <input 
          type="range" 
          [(ngModel)]="maxLength" 
          min="20" 
          max="500" 
          step="10"
          class="slider"
        />
      </div>
    </div>
  </div>

  <!-- Pulsanti Azione -->
  <div class="action-buttons">
    <button 
      (click)="onSummarize()" 
      [disabled]="!isValid"
      class="btn btn-primary"
    >
      🚀 Genera Riassunto
    </button>
    <button 
      (click)="onReset()" 
      class="btn btn-secondary"
    >
      🔄 Reset
    </button>
  </div>
</div>
